<script type="text/x-dc" data-dc-script data-props='{
  "species": {"editor": "enum", "options": ["cat", "dog"], "default": "cat"},
  "mood": {"editor": "enum", "options": ["lazy", "explorer", "shy", "boss", "sweet", "grumpy"], "default": "lazy"},
  "size": {"editor": "int", "default": 240, "min": 60, "max": 400},
  "$preview": {"width": 240, "height": 220}
}'>
class Component extends DCLogic {
  renderVals() {
    const sp = this.props.species ?? 'cat';
    const mood = this.props.mood ?? 'lazy';
    const w = this.props.size ?? 240;
    return {
      w,
      h: Math.round(w * 110 / 120),
      catLazy: sp === 'cat' && mood === 'lazy',
      catExplorer: sp === 'cat' && mood === 'explorer',
      catShy: sp === 'cat' && mood === 'shy',
      catBoss: sp === 'cat' && mood === 'boss',
      catSweet: sp === 'cat' && mood === 'sweet',
      catGrumpy: sp === 'cat' && mood === 'grumpy',
      dogLazy: sp === 'dog' && mood === 'lazy',
      dogExplorer: sp === 'dog' && mood === 'explorer',
      dogShy: sp === 'dog' && mood === 'shy',
      dogBoss: sp === 'dog' && mood === 'boss',
      dogSweet: sp === 'dog' && mood === 'sweet',
      dogGrumpy: sp === 'dog' && mood === 'grumpy',
    };
  }
}
